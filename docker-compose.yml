services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    image: fasa-social-dashboard-mysql:latest
    restart: unless-stopped
    volumes:
      - /srv/fasa-data/data/fasa-social/mysql:/var/lib/mysql
      - /srv/fasa-data/data/fasa-social/fasa-social.env:/run/secrets/fasa-social.env:ro
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/fasa-social-mysql-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: fasa-social-dashboard-backend:latest
    restart: unless-stopped
    volumes:
      - /srv/fasa-data/data/fasa-social/fasa-social.env:/run/secrets/fasa-social.env:ro
      - /srv/fasa-data/data/fasa-social/assets:/app/storage/assets
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: fasa-social-dashboard-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
